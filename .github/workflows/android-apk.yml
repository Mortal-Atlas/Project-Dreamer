# Builds a sideloadable APK with GameCI.
# You need a Unity license in the repository secrets:
#   UNITY_LICENSE  (the contents of your .ulf license file, or the GameCI activation output)
#   UNITY_EMAIL
#   UNITY_PASSWORD
# Run it by hand from the Actions tab (workflow_dispatch). It does not run on every push.
name: Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Dream Machine APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.19f1
          targetPlatform: Android
          buildMethod: DreamMachine.EditorTools.BuildScript.BuildAndroid
          buildsPath: Builds
          androidAppBundle: false

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DreamMachine-apk
          path: Builds/**/*.apk
          if-no-files-found: error
